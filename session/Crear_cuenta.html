<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi registro</title>
    <link rel="stylesheet">
</head>
<body>
    <form id="registro">
        <h3>Registro de usuarios</h3>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Ingrese Nombre..." required><br><br>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" placeholder="Ingrese Correo electrónico..." required><br><br>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" placeholder="Ingrese Dirección..." required><br><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" placeholder="Ingrese Contraseña..." required><br><br>

        <button type="submit">Registrarse</button>
        <p id="mensaje"></p>
    </form>
    <script src="registro.js"></script>
</body>
</html>
