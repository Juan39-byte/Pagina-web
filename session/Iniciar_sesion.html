<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>

    <link rel="stylesheet" href="../CSS/estilo1.css">
</head>

<body>

    <form id="login">

        <h2>Iniciar Sesión</h2>

        <input type="email"
        id="email"
        placeholder="Correo"
        required>

        <br><br>

        <input type="password"
        id="password"
        placeholder="Contraseña"
        required>

        <br><br>

        <button type="submit">Ingresar</button>

        <p id="mensaje"></p>

    </form>

    <script src="login.js"></script>

</body>
</html>
